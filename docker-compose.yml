services:
  kresna:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kresna-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      BIND_HOST: "0.0.0.0"
      LOCAL_SINGLE_USER_MODE: "true"
      ENABLE_MULTI_USER_AUTH: "false"
      OLLAMA_BASE_URL: "http://ollama:11434"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "kresna_knowledge"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-}"
      KRESNA_ENCRYPTION_KEY: "${KRESNA_ENCRYPTION_KEY:-}"
    volumes:
      - kresna_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: kresna-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kresna-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  kresna_data:
  ollama_data:
  qdrant_data:
